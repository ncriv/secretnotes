name: secretnotes
description: "Encrypted local notes app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4

  # Rich text editor
  flutter_quill: ^11.1.0
  dart_quill_delta: ^10.8.0

  # Encryption / key derivation
  pointycastle: ^3.9.1

  # Biometrics
  local_auth: ^2.3.0

  # State management
  provider: ^6.1.2

  # Sync transport
  http: ^1.2.2

  # Backup export/import (share sheet + file picking)
  share_plus: ^10.1.4
  file_picker: ^8.1.6
  path_provider: ^2.1.5

  # Utilities
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
